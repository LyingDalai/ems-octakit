name: Sync upstream

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 2"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Merge upstream
        run: |
          git remote add upstream https://github.com/emuyia/ems-octakit.git
          git fetch --no-tags upstream
          git merge --no-edit "upstream/${{ github.event.repository.default_branch }}"

      - name: Push
        run: git push origin "HEAD:${{ github.event.repository.default_branch }}"
